<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鱼群 · Boids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #020814; color: #eef1ff; font-family: "Inter", "PingFang SC", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .head { position: fixed; top: 28px; left: 5vw; z-index: 2; pointer-events: none; }
  .head .tag { font-size: 11px; letter-spacing: .4em; color: #5ff8ff; }
  .head h1 { font-size: clamp(44px, 7vw, 100px); font-weight: 900; letter-spacing: -.02em; margin-top: 8px; line-height: 1; }
  .head p { margin-top: 10px; font-size: 12px; letter-spacing: .25em; color: #8b9ec8; }
  .rules { position: fixed; right: 5vw; top: 50%; transform: translateY(-50%); z-index: 3; display: grid; gap: 16px; width: 200px; }
  .rules label { display: block; font-size: 11px; letter-spacing: .2em; color: #8b9ec8; }
  .rules label b { float: right; color: #fff; font-weight: 500; }
  .rules input { width: 100%; margin-top: 6px; accent-color: #5ff8ff; }
  .ctrl { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 999px; border: 1px solid #ffffff22; background: #06101ee6; }
  .ctrl button { border: 1px solid transparent; background: none; color: #c9d6ee; padding: 9px 14px; border-radius: 999px; font-size: 13px; letter-spacing: .08em; transition: .3s; white-space: nowrap; }
  .ctrl button:hover { border-color: #ffffff44; }
  .ctrl button.on { background: linear-gradient(90deg, #5ff8ff, #3d8bff); color: #020814; font-weight: 700; }
  .ctrl .sep { width: 1px; align-self: stretch; background: #ffffff22; margin: 4px; }
  .hint { position: fixed; left: 5vw; bottom: 40px; z-index: 2; font-size: 11px; letter-spacing: .25em; color: #8b9ec8; pointer-events: none; }
  @media (max-width: 760px) {
    .head { left: 16px; } .hint, .rules { display: none; }
    .ctrl { bottom: 84px; flex-wrap: wrap; justify-content: center; border-radius: 22px; width: calc(100% - 32px); } .ctrl .sep { display: none; }
    .ctrl button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="head">
  <div class="tag mono">BOIDS / 15 · FLOCKING</div>
  <h1>鱼群</h1>
  <p>每条鱼只遵守三条规则：分离 · 对齐 · 聚合</p>
</div>
<div class="rules mono">
  <div><label>分离 SEPARATION <b id="vs">1.6</b></label><input type="range" id="sep" min="0" max="4" step=".1" value="1.6"></div>
  <div><label>对齐 ALIGNMENT <b id="va">1.0</b></label><input type="range" id="ali" min="0" max="3" step=".1" value="1"></div>
  <div><label>聚合 COHESION <b id="vc">0.8</b></label><input type="range" id="coh" min="0" max="3" step=".1" value=".8"></div>
</div>
<div class="hint mono">移动鼠标引导鱼群 · 拖动旋转视角 · 滚轮缩放</div>
<div class="ctrl">
  <button data-m="attract" class="on">吸引</button>
  <button data-m="scare">驱散</button>
  <button data-m="none">无</button>
  <span class="sep"></span>
  <button id="shark" class="on">捕食者</button>
  <button id="vortex">漩涡</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const NB = innerWidth < 760 ? 700 : 1600, BOUND = 13, R = 1.3, MAXV = 5.5, MINV = 2;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020814, .03);
scene.background = new THREE.Color(0x020814);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 200);
camera.position.set(0, 4, camera.aspect < 1 ? 42 : 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false; controls.autoRotate = true; controls.autoRotateSpeed = .3;

// 水下光束与浮游微粒
const motes = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(2500 * 3).map(() => (Math.random() - .5) * 60), 3)),
  new THREE.PointsMaterial({ size: .06, color: 0x6fb8ff, transparent: true, opacity: .5 }));
scene.add(motes);
for (let i = 0; i < 6; i++) {
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.6, 3.5, 60, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0x3d8bff, transparent: true, opacity: .035, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  beam.position.set((Math.random() - .5) * 40, 10, (Math.random() - .5) * 30 - 10);
  beam.rotation.z = (Math.random() - .5) * .4;
  scene.add(beam);
}

// ---------- 鱼 ----------
const fishGeo = new THREE.ConeGeometry(.12, .55, 5); fishGeo.rotateX(Math.PI / 2);
const fish = new THREE.InstancedMesh(fishGeo, new THREE.MeshBasicMaterial(), NB);
const P = new Float32Array(NB * 3), V = new Float32Array(NB * 3), A = new Float32Array(NB * 3);
for (let i = 0; i < NB; i++) {
  const p = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * BOUND * .8);
  const v = new THREE.Vector3().randomDirection().multiplyScalar(3);
  P.set([p.x, p.y, p.z], i * 3); V.set([v.x, v.y, v.z], i * 3);
}
scene.add(fish);
const col = new THREE.Color(), dummy = new THREE.Object3D(), fwd = new THREE.Vector3();

// 捕食者
const shark = new THREE.Mesh(new THREE.ConeGeometry(.45, 2.2, 6).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xff3d6e }));
const sharkGlow = new THREE.PointLight(0xff3d6e, 0, 6); shark.add(sharkGlow);
scene.add(shark);
const SP = new THREE.Vector3(BOUND, 0, 0), SV = new THREE.Vector3(-3, 0, 0);

// ---------- 交互 ----------
const $ = id => document.getElementById(id);
let mode = 'attract', sharkOn = true, vortex = false;
const W = { sep: 1.6, ali: 1, coh: .8 };
[['sep', 'vs'], ['ali', 'va'], ['coh', 'vc']].forEach(([id, out]) => $(id).oninput = e => { W[id] = +e.target.value; $(out).textContent = W[id].toFixed(1); });
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); });
$('shark').onclick = () => { sharkOn = !sharkOn; $('shark').classList.toggle('on', sharkOn); shark.visible = sharkOn; };
$('vortex').onclick = () => { vortex = !vortex; $('vortex').classList.toggle('on', vortex); };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(9, 9), target = new THREE.Vector3(), plane = new THREE.Plane();
let hasTarget = false;
addEventListener('pointermove', e => ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));
renderer.domElement.addEventListener('pointerleave', () => ndc.set(9, 9));

// ---------- 空间网格加速邻居查找 ----------
const grid = new Map();
const key = (x, y, z) => ((x + 64) * 128 + (y + 64)) * 128 + (z + 64);
function buildGrid() {
  grid.clear();
  for (let i = 0; i < NB; i++) {
    const k = key(Math.floor(P[i * 3] / R), Math.floor(P[i * 3 + 1] / R), Math.floor(P[i * 3 + 2] / R));
    let cell = grid.get(k); if (!cell) grid.set(k, cell = []); cell.push(i);
  }
}

function step(dt, t) {
  buildGrid();
  const R2 = R * R, sx = SP.x, sy = SP.y, sz = SP.z;
  for (let i = 0; i < NB; i++) {
    const ix = i * 3, px = P[ix], py = P[ix + 1], pz = P[ix + 2];
    let n = 0, ax = 0, ay = 0, az = 0, cx = 0, cy = 0, cz = 0, sxx = 0, syy = 0, szz = 0;
    const gx = Math.floor(px / R), gy = Math.floor(py / R), gz = Math.floor(pz / R);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) {
      const cell = grid.get(key(gx + a, gy + b, gz + c)); if (!cell) continue;
      for (const j of cell) {
        if (j === i) continue;
        const jx = j * 3, dx = P[jx] - px, dy = P[jx + 1] - py, dz = P[jx + 2] - pz, d2 = dx * dx + dy * dy + dz * dz;
        if (d2 > R2 || n > 24) continue;
        n++; ax += V[jx]; ay += V[jx + 1]; az += V[jx + 2]; cx += dx; cy += dy; cz += dz;
        if (d2 < .35) { const f = 1 / (d2 + .01); sxx -= dx * f; syy -= dy * f; szz -= dz * f; }
      }
    }
    let fx = 0, fy = 0, fz = 0;
    if (n) {
      fx += (ax / n - V[ix]) * W.ali * .9 + cx / n * W.coh * .9 + sxx * W.sep * .05;
      fy += (ay / n - V[ix + 1]) * W.ali * .9 + cy / n * W.coh * .9 + syy * W.sep * .05;
      fz += (az / n - V[ix + 2]) * W.ali * .9 + cz / n * W.coh * .9 + szz * W.sep * .05;
    }
    // 软边界：离中心越远越往回拉
    const r = Math.hypot(px, py * 1.6, pz);
    if (r > BOUND) { const k = (r - BOUND) * .8 / r; fx -= px * k; fy -= py * k * 1.6; fz -= pz * k; }
    // 鼠标吸引/驱散
    if (hasTarget && mode !== 'none') {
      const dx = target.x - px, dy = target.y - py, dz = target.z - pz, d = Math.hypot(dx, dy, dz) + .1;
      if (mode === 'attract') { const k = 2.2 / d; fx += dx * k; fy += dy * k; fz += dz * k; }
      else if (d < 6) { const k = -60 / (d * d * d); fx += dx * k; fy += dy * k; fz += dz * k; }
    }
    // 捕食者：近距离四散逃开
    if (sharkOn) {
      const dx = px - sx, dy = py - sy, dz = pz - sz, d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < 25) { const k = 40 / (d2 + .5); fx += dx * k; fy += dy * k; fz += dz * k; }
    }
    if (vortex) { fx += -pz * .6 - px * .05; fz += px * .6 - pz * .05; fy += Math.sin(t + r * .3) * .4 - py * .1; }
    A[ix] = fx; A[ix + 1] = fy; A[ix + 2] = fz;
  }
  for (let i = 0; i < NB; i++) {
    const ix = i * 3;
    let vx = V[ix] + A[ix] * dt, vy = V[ix + 1] + A[ix + 1] * dt, vz = V[ix + 2] + A[ix + 2] * dt;
    const s = Math.hypot(vx, vy, vz) || 1, cl = Math.min(Math.max(s, MINV), MAXV) / s;
    vx *= cl; vy *= cl; vz *= cl;
    V[ix] = vx; V[ix + 1] = vy; V[ix + 2] = vz;
    P[ix] += vx * dt; P[ix + 1] += vy * dt; P[ix + 2] += vz * dt;
  }
  // 捕食者追向鱼群中心最近的一条
  if (sharkOn) {
    let best = 1e9, bi = 0;
    for (let i = 0; i < NB; i += 7) { const d = (P[i * 3] - sx) ** 2 + (P[i * 3 + 1] - sy) ** 2 + (P[i * 3 + 2] - sz) ** 2; if (d < best) { best = d; bi = i; } }
    const tx = P[bi * 3] - sx, ty = P[bi * 3 + 1] - sy, tz = P[bi * 3 + 2] - sz, td = Math.hypot(tx, ty, tz) || 1;
    SV.x += (tx / td * 6.5 - SV.x) * dt * 1.2; SV.y += (ty / td * 6.5 - SV.y) * dt * 1.2; SV.z += (tz / td * 6.5 - SV.z) * dt * 1.2;
    SP.addScaledVector(SV, dt);
    shark.position.copy(SP); shark.lookAt(fwd.copy(SP).add(SV));
    sharkGlow.intensity = 3;
  }
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .7, .5, .25));
composer.addPass(new OutputPass());
window.NEBULA?.adaptive(r => { renderer.setPixelRatio(r); composer.setPixelRatio(r); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
  hasTarget = false;
  if (ndc.x < 5) {
    ray.setFromCamera(ndc, camera);
    plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(fwd).negate(), controls.target);
    hasTarget = !!ray.ray.intersectPlane(plane, target);
  }
  step(dt, t);
  for (let i = 0; i < NB; i++) {
    const ix = i * 3;
    dummy.position.set(P[ix], P[ix + 1], P[ix + 2]);
    dummy.lookAt(P[ix] + V[ix], P[ix + 1] + V[ix + 1], P[ix + 2] + V[ix + 2]);
    dummy.updateMatrix();
    fish.setMatrixAt(i, dummy.matrix);
    const s = (Math.hypot(V[ix], V[ix + 1], V[ix + 2]) - MINV) / (MAXV - MINV);
    fish.setColorAt(i, col.setHSL(.55 - s * .12 + Math.sin(i) * .03, 1, .45 + s * .25));
  }
  fish.instanceMatrix.needsUpdate = true; fish.instanceColor.needsUpdate = true;
  motes.rotation.y = t * .01;
  controls.update();
  composer.render();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
<script src="shared.js?v=20261022"></script>
</body>
</html>
