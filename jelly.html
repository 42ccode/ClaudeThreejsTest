<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>果冻软体 · Jelly</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0816; color: #fff; font-family: "Inter", "PingFang SC", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .head { position: fixed; top: 28px; left: 5vw; z-index: 2; pointer-events: none; }
  .head .tag { font-size: 11px; letter-spacing: .4em; color: #ff8fd8; }
  .head h1 { font-size: clamp(44px, 7vw, 100px); font-weight: 900; letter-spacing: -.02em; margin-top: 8px; line-height: 1; }
  .head p { margin-top: 10px; font-size: 12px; letter-spacing: .25em; color: #a89cc8; }
  .ctrl { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 999px; border: 1px solid #ffffff22; background: #140f24ee; }
  .ctrl button { border: 1px solid transparent; background: none; color: #e4dcf5; padding: 9px 14px; border-radius: 999px; font-size: 13px; letter-spacing: .08em; transition: .3s; white-space: nowrap; }
  .ctrl button:hover { border-color: #ffffff44; }
  .ctrl button.on { background: linear-gradient(90deg, #ff8fd8, #ffd84d); color: #1a0a18; font-weight: 700; }
  .ctrl .sep { width: 1px; align-self: stretch; background: #ffffff22; margin: 4px; }
  .hint { position: fixed; left: 5vw; bottom: 40px; z-index: 2; font-size: 11px; letter-spacing: .25em; color: #a89cc8; pointer-events: none; }
  @media (max-width: 760px) {
    .head { left: 16px; } .hint { display: none; }
    .ctrl { bottom: 84px; flex-wrap: wrap; justify-content: center; border-radius: 22px; width: calc(100% - 32px); } .ctrl .sep { display: none; }
    .ctrl button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="head">
  <div class="tag mono">JELLY / PHYSICS · SOFT BODY</div>
  <h1>果冻软体</h1>
  <p>Q 弹的果冻小伙伴 · 抓起来、甩出去、看它们晃</p>
</div>
<div class="hint mono">拖动抓起并甩出 · 双击生成新果冻</div>
<div class="ctrl">
  <button id="rain">🍮 下果冻雨</button>
  <button id="flip">↕ 翻转重力</button>
  <button id="soft" class="on">软</button>
  <button id="hard">硬</button>
  <span class="sep"></span>
  <button id="clear">清空</button>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const dpr = Math.min(devicePixelRatio, 2);
  let W, H, FLOOR;
  const COLORS = [['#ff6fb5', '#ff9fd2'], ['#5fd8ff', '#a8ecff'], ['#ffc84d', '#ffe39a'], ['#8dff9a', '#c8ffd0'], ['#b18cff', '#d8c6ff'], ['#ff8a5c', '#ffc0a0']];
  const blobs = [], obstacles = [];
  let gravity = 1, stiff = .06, grab = null;
  const mouse = { x: -999, y: -999, px: 0, py: 0 };

  function resize() {
    W = innerWidth; H = innerHeight; FLOOR = H - (W < 760 ? 170 : 104);   // 地面抬到控制条上方
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    obstacles.length = 0;
    const s = Math.min(W, H);
    obstacles.push({ x: W * .3, y: H * .55, r: s * .07 }, { x: W * .7, y: H * .5, r: s * .09 }, { x: W * .52, y: H * .7, r: s * .05 });
  }

  // 果冻：一圈质点 + 形状匹配（把质点拉回刚性旋转后的原始形状）
  function spawn(x, y, r = 40 + Math.random() * 30) {
    const N = 22, rest = [], P = [], O = [];
    const star = Math.random() < .25;
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2, rr = star ? r * (1 + .25 * Math.cos(a * 5)) : r;
      rest.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      P.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); O.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    const [c1, c2] = COLORS[Math.random() * COLORS.length | 0];
    blobs.push({ N, rest, P, O, r, c1, c2, blink: Math.random() * 4, cx: x, cy: y, angle: 0, squash: 0 });
    if (blobs.length > 14) blobs.shift();
  }

  function step(dt) {
    const g = 1400 * gravity * dt * dt;
    for (const b of blobs) {
      // Verlet 积分
      for (let i = 0; i < b.N; i++) {
        const p = b.P[i], o = b.O[i], vx = (p[0] - o[0]) * .995, vy = (p[1] - o[1]) * .995;
        o[0] = p[0]; o[1] = p[1];
        p[0] += vx; p[1] += vy + g;
      }
      // 形状匹配：求质心与最佳旋转角，再把每个点拉向目标位置
      let cx = 0, cy = 0;
      for (const p of b.P) { cx += p[0]; cy += p[1]; }
      cx /= b.N; cy /= b.N;
      let sn = 0, cs = 0;
      for (let i = 0; i < b.N; i++) { const qx = b.P[i][0] - cx, qy = b.P[i][1] - cy, [rx, ry] = b.rest[i]; cs += rx * qx + ry * qy; sn += rx * qy - ry * qx; }
      const ang = Math.atan2(sn, cs), ca = Math.cos(ang), sa = Math.sin(ang);
      for (let i = 0; i < b.N; i++) {
        const [rx, ry] = b.rest[i], tx = cx + rx * ca - ry * sa, ty = cy + rx * sa + ry * ca;
        b.P[i][0] += (tx - b.P[i][0]) * stiff; b.P[i][1] += (ty - b.P[i][1]) * stiff;
      }
      b.cx = cx; b.cy = cy; b.angle = ang;
      // 边界与障碍物
      for (let i = 0; i < b.N; i++) {
        const p = b.P[i], o = b.O[i];
        if (p[1] > FLOOR) { p[1] = FLOOR; o[0] = p[0] - (p[0] - o[0]) * .6; }
        if (p[1] < 0) { p[1] = 0; o[0] = p[0] - (p[0] - o[0]) * .6; }
        if (p[0] < 0) p[0] = 0; if (p[0] > W) p[0] = W;
        for (const ob of obstacles) {
          const dx = p[0] - ob.x, dy = p[1] - ob.y, d = Math.hypot(dx, dy);
          if (d < ob.r) { p[0] = ob.x + dx / d * ob.r; p[1] = ob.y + dy / d * ob.r; }
        }
      }
    }
    // 果冻之间：质心距离过近时，把朝向对方的质点推开
    for (let a = 0; a < blobs.length; a++) for (let c = a + 1; c < blobs.length; c++) {
      const A = blobs[a], B = blobs[c], dx = B.cx - A.cx, dy = B.cy - A.cy, d = Math.hypot(dx, dy) || 1, ov = A.r + B.r - d;
      if (ov <= 0) continue;
      const nx = dx / d, ny = dy / d, k = ov * .25;
      for (const p of A.P) if ((p[0] - A.cx) * nx + (p[1] - A.cy) * ny > 0) { p[0] -= nx * k; p[1] -= ny * k; }
      for (const p of B.P) if ((p[0] - B.cx) * nx + (p[1] - B.cy) * ny < 0) { p[0] += nx * k; p[1] += ny * k; }
    }
    // 抓取：被抓的一圈点跟随鼠标
    if (grab) {
      const b = grab.blob, tx = mouse.x - grab.ox, ty = mouse.y - grab.oy;
      for (const i of grab.idx) { b.P[i][0] += (tx + b.rest[i][0] * .2 - b.P[i][0]) * .35; b.P[i][1] += (ty + b.rest[i][1] * .2 - b.P[i][1]) * .35; }
    }
  }

  // ---------- 绘制：平滑轮廓 + 渐变 + 高光 + 会看人的眼睛 ----------
  function drawBlob(b, t) {
    const P = b.P, N = b.N;
    ctx.beginPath();
    const mid = i => [(P[i][0] + P[(i + 1) % N][0]) / 2, (P[i][1] + P[(i + 1) % N][1]) / 2];
    let m = mid(N - 1); ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < N; i++) { const n = mid(i); ctx.quadraticCurveTo(P[i][0], P[i][1], n[0], n[1]); }
    ctx.closePath();
    const g = ctx.createRadialGradient(b.cx - b.r * .35, b.cy - b.r * .4, b.r * .1, b.cx, b.cy, b.r * 1.3);
    g.addColorStop(0, b.c2); g.addColorStop(1, b.c1);
    ctx.shadowColor = b.c1; ctx.shadowBlur = 24;
    ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0;
    // 高光
    ctx.beginPath(); ctx.ellipse(b.cx - b.r * .35, b.cy - b.r * .45, b.r * .22, b.r * .12, -.5, 0, 7);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    // 眼睛：随旋转角摆放，瞳孔看向鼠标，偶尔眨眼；被抓时张嘴
    const ca = Math.cos(b.angle), sa = Math.sin(b.angle);
    const blink = (t + b.blink) % 4 < .12;
    for (const s of [-1, 1]) {
      const ex = b.cx + (s * b.r * .28) * ca - (-b.r * .05) * sa, ey = b.cy + (s * b.r * .28) * sa + (-b.r * .05) * ca;
      const er = b.r * .15;
      ctx.beginPath();
      if (blink) { ctx.ellipse(ex, ey, er, er * .12, b.angle, 0, 7); ctx.fillStyle = '#1a1028'; ctx.fill(); continue; }
      ctx.arc(ex, ey, er, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
      const dx = mouse.x - ex, dy = mouse.y - ey, d = Math.hypot(dx, dy) || 1, k = Math.min(er * .45, d * .1);
      ctx.beginPath(); ctx.arc(ex + dx / d * k, ey + dy / d * k, er * .5, 0, 7); ctx.fillStyle = '#1a1028'; ctx.fill();
    }
    const mx = b.cx - (-b.r * .3) * sa, my = b.cy + (b.r * .3) * ca;
    ctx.beginPath();
    if (grab && grab.blob === b) { ctx.ellipse(mx, my, b.r * .1, b.r * .13, b.angle, 0, 7); ctx.fillStyle = '#1a1028'; ctx.fill(); }
    else { ctx.arc(mx, my - b.r * .08, b.r * .12, .2 + b.angle, Math.PI - .2 + b.angle); ctx.strokeStyle = '#1a1028'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke(); }
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const fg = ctx.createLinearGradient(0, FLOOR, 0, H); fg.addColorStop(0, '#2a1f48'); fg.addColorStop(1, '#0b0816');
    ctx.fillStyle = fg; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = '#ff8fd855'; ctx.fillRect(0, FLOOR, W, 2);
    for (const ob of obstacles) {
      const g = ctx.createRadialGradient(ob.x - ob.r * .3, ob.y - ob.r * .3, 0, ob.x, ob.y, ob.r);
      g.addColorStop(0, '#3a3058'); g.addColorStop(1, '#1c1630');
      ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r, 0, 7); ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 2; ctx.stroke();
    }
    blobs.forEach(b => drawBlob(b, t));
  }

  // ---------- 交互 ----------
  const pt = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
  cv.addEventListener('pointerdown', e => {
    pt(e);
    let best = null, bd = 1e9;
    for (const b of blobs) { const d = Math.hypot(b.cx - mouse.x, b.cy - mouse.y); if (d < b.r * 1.2 && d < bd) { bd = d; best = b; } }
    if (!best) return;
    // 抓住离鼠标最近的几个质点
    const idx = best.P.map((p, i) => [Math.hypot(p[0] - mouse.x, p[1] - mouse.y), i]).sort((a, b) => a[0] - b[0]).slice(0, 6).map(v => v[1]);
    grab = { blob: best, idx, ox: 0, oy: 0 };
  });
  addEventListener('pointermove', pt);
  addEventListener('pointerup', () => { grab = null; });
  cv.addEventListener('dblclick', e => spawn(e.clientX, e.clientY));
  const $ = id => document.getElementById(id);
  $('rain').onclick = () => { for (let i = 0; i < 6; i++) setTimeout(() => spawn(80 + Math.random() * (W - 160), gravity > 0 ? -60 : FLOOR - 60), i * 180); };
  $('flip').onclick = () => { gravity *= -1; $('flip').classList.toggle('on', gravity < 0); };
  $('soft').onclick = () => { stiff = .06; $('soft').classList.add('on'); $('hard').classList.remove('on'); };
  $('hard').onclick = () => { stiff = .22; $('hard').classList.add('on'); $('soft').classList.remove('on'); };
  $('clear').onclick = () => { blobs.length = 0; };

  function start() {
    if (!innerWidth || !innerHeight) { requestAnimationFrame(start); return; }   // 窗口尚无尺寸时稍后再试
    resize();
    for (let i = 0; i < 5; i++) spawn(W * (.2 + i * .15), H * .3 - i * 40);
    let last = performance.now(), acc = 0;
    (function loop(now) {
      acc = Math.min(acc + (now - last) / 1000, .05); last = now;
      while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; }   // 固定 120Hz 物理步长
      draw(now / 1000);
      requestAnimationFrame(loop);
    })(last);
    addEventListener('resize', resize);
  }
  start();
})();
</script>
<script src="shared.js?v=20261022"></script>
</body>
</html>
