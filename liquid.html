<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>液态金属 · Liquid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05050a; color: #eef1ff; font-family: "Inter", "PingFang SC", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 5vw 110px; z-index: 2; }
  .top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .4em; }
  .title { font-size: clamp(64px, 14vw, 220px); font-weight: 900; letter-spacing: -.04em; line-height: .9; mix-blend-mode: difference; }
  .title span { display: inline-block; animation: float 6s ease-in-out infinite; }
  .title span:nth-child(2) { animation-delay: -1s; } .title span:nth-child(3) { animation-delay: -2s; } .title span:nth-child(4) { animation-delay: -3s; }
  @keyframes float { 50% { transform: translateY(-14px) skewX(-4deg); } }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .tip { color: #8b90b8; font-size: 13px; letter-spacing: .1em; line-height: 1.8; }
  .modes { display: flex; gap: 10px; pointer-events: auto; }
  .modes button { background: #ffffff0d; border: 1px solid #ffffff30; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 13px; letter-spacing: .15em; backdrop-filter: blur(8px); transition: .3s; }
  .modes button.on { background: #fff; color: #05050a; }
  @media (max-width: 700px) { .ui { padding: 20px 16px 90px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <div class="top"><span>LIQUID / 02</span><span>RAYMARCHING</span></div>
  <div class="title"><span>液</span><span>态</span><br><span>金</span><span>属</span></div>
  <div class="bottom">
    <div class="tip">实时光线步进 · 有向距离场融合<br>移动鼠标牵引液滴 · 点击激起涟漪</div>
    <div class="modes"><button class="on" data-m="0">幻彩</button><button data-m="1">黄金</button><button data-m="2">果冻</button></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl') });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const u = {
  uRes: { value: new THREE.Vector2() }, uTime: { value: 0 },
  uMouse: { value: new THREE.Vector2(0, 0) }, uClick: { value: 0 }, uMode: { value: 0 },
};
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: u,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: /* glsl */`
    uniform vec2 uRes, uMouse; uniform float uTime, uClick, uMode;
    float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
    float map(vec3 p){
      float d = 1e5;
      for (int i = 0; i < 6; i++) {
        float fi = float(i);
        vec3 c = vec3(sin(uTime*.45 + fi*1.7)*1.7, cos(uTime*.37 + fi*2.3)*1.0, sin(uTime*.29 + fi*3.1)*.9);
        d = smin(d, length(p - c) - (.42 + .12*sin(fi*2. + uTime)), .7);
      }
      d = smin(d, length(p - vec3(uMouse, .6)) - .5, .8);
      float rip = sin(length(p.xy - uMouse)*10. - uTime*8.) * .035 * uClick;
      return d + rip + sin(p.x*5. + uTime)*sin(p.y*5. + uTime*1.3)*sin(p.z*5.)*.015;
    }
    vec3 calcN(vec3 p){ vec2 e = vec2(.0015, 0.);
      return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx))); }
    vec3 env(vec3 r){
      vec3 c = mix(vec3(.03,.03,.06), vec3(.75,.8,.95), smoothstep(-.2, 1., r.y));
      c += vec3(1.) * smoothstep(.97, 1., sin(r.x*4. + uTime*.3)) * smoothstep(0., .5, r.y) * 1.5;
      c += vec3(1.,.35,.75) * pow(max(dot(r, normalize(vec3(-1.,.4,.6))), 0.), 24.) * 3.;
      c += vec3(.3,.9,1.) * pow(max(dot(r, normalize(vec3(1.,.2,.5))), 0.), 24.) * 3.;
      return c;
    }
    void main(){
      vec2 uv = (gl_FragCoord.xy - .5*uRes) / uRes.y;
      vec3 ro = vec3(0., 0., 5.), rd = normalize(vec3(uv, -1.6));
      float t = 0., minD = 1e5; bool hit = false;
      for (int i = 0; i < 90; i++) {
        float d = map(ro + rd*t); minD = min(minD, d);
        if (d < .001) { hit = true; break; }
        t += d * .9; if (t > 12.) break;
      }
      vec3 col = vec3(.015,.015,.03) + vec3(.08,.05,.15) * (1. - length(uv));
      vec2 g = abs(fract(uv*12.) - .5);
      col += vec3(.05) * smoothstep(.47, .5, max(g.x, g.y)) * (1. - length(uv));
      vec3 glowC = .5 + .5*cos(6.2831*(uTime*.1 + vec3(0., .33, .67)));
      if (!hit) col += glowC * exp(-minD*5.) * .35;
      else {
        vec3 p = ro + rd*t, n = calcN(p), r = reflect(rd, n);
        float fres = pow(1. - max(dot(-rd, n), 0.), 3.);
        vec3 film = .5 + .5*cos(6.2831*(fres*1.3 + dot(n, vec3(.3,.5,.2)) + uTime*.08 + vec3(0., .33, .67)));
        vec3 c0 = env(r) * mix(vec3(.9), film, .75) + fres*film*.8;
        vec3 c1 = env(r) * vec3(1., .72, .32) + fres*vec3(1., .8, .5)*.5;
        vec3 L = normalize(vec3(.5, .8, .6));
        float dif = max(dot(n, L), 0.), sss = pow(clamp(1. - dot(n, -rd), 0., 1.), 2.);
        vec3 base = mix(vec3(.2,.95,1.), vec3(1.,.3,.75), n.y*.5 + .5);
        vec3 c2 = base*(.35 + .5*dif) + base*sss*.8 + pow(max(dot(r, L), 0.), 40.)*1.2;
        col = mix(mix(c0, c1, clamp(uMode, 0., 1.)), c2, clamp(uMode - 1., 0., 1.));
      }
      col *= 1. - .35*dot(uv, uv);
      col = 1. - exp(-col*1.5);
      gl_FragColor = vec4(col, 1.);
    }`,
})));

const mouseT = new THREE.Vector2();
addEventListener('pointermove', e => {
  const s = 5 / 1.6;
  mouseT.set((e.clientX / innerWidth - .5) * (innerWidth / innerHeight) * s, (.5 - e.clientY / innerHeight) * s);
});
addEventListener('pointerdown', e => { if (!e.target.closest('button,a,nav')) u.uClick.value = 1; });

let modeT = 0;
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
  modeT = +b.dataset.m;
});

function resize() { renderer.setSize(innerWidth, innerHeight); renderer.getDrawingBufferSize(u.uRes.value); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  u.uTime.value = clock.getElapsedTime();
  u.uMouse.value.lerp(mouseT, 0.08);
  u.uClick.value *= 0.975;
  u.uMode.value += (modeT - u.uMode.value) * 0.05;
  renderer.render(scene, camera);
});
</script>
<script src="shared.js?v=20261022"></script>
</body>
</html>
