<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>流体墨水 · Fluid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #f2f2f7; font-family: "Inter", "PingFang SC", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .head { position: fixed; top: 28px; left: 5vw; z-index: 2; pointer-events: none; mix-blend-mode: difference; }
  .head .tag { font-size: 11px; letter-spacing: .4em; }
  .head h1 { font-size: clamp(44px, 7vw, 100px); font-weight: 900; letter-spacing: -.02em; margin-top: 8px; line-height: 1; }
  .head p { margin-top: 10px; font-size: 12px; letter-spacing: .25em; opacity: .7; }
  .hint { position: fixed; left: 5vw; bottom: 40px; z-index: 2; font-size: 11px; letter-spacing: .3em; opacity: .6; pointer-events: none; }
  .ctrl { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 999px; border: 1px solid #ffffff22; background: #0a0a12c0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .ctrl button { border: 1px solid transparent; background: none; color: #d0d4e8; padding: 9px 14px; border-radius: 999px; font-size: 13px; letter-spacing: .08em; transition: .3s; white-space: nowrap; }
  .ctrl button:hover { border-color: #ffffff44; }
  .ctrl button.on { background: #fff; color: #000; font-weight: 700; }
  .ctrl .sep { width: 1px; align-self: stretch; background: #ffffff22; margin: 4px; }
  .ctrl i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  @media (max-width: 760px) {
    .head { left: 16px; } .hint { display: none; }
    .ctrl { bottom: 84px; flex-wrap: wrap; justify-content: center; border-radius: 22px; width: calc(100% - 32px); } .ctrl .sep { display: none; }
    .ctrl button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="head">
  <div class="tag mono">FLUID / 10 · NAVIER–STOKES ON GPU</div>
  <h1>流体墨水</h1>
  <p>实时求解不可压缩流体 · 涡度约束 · 随音乐喷溅</p>
</div>
<div class="hint mono">滑动搅动 · 点击喷溅 · 空格随机</div>
<div class="ctrl" id="ctrl">
  <button data-p="neon" class="on"><i style="background:linear-gradient(90deg,#5ff8ff,#ff3dbb)"></i>霓虹</button>
  <button data-p="rainbow"><i style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"></i>彩虹</button>
  <button data-p="lava"><i style="background:linear-gradient(90deg,#ff3b00,#ffd000)"></i>熔岩</button>
  <button data-p="ocean"><i style="background:linear-gradient(90deg,#00c3ff,#3d5cff)"></i>深海</button>
  <span class="sep"></span>
  <button id="sym">万花筒</button>
  <button id="burst">随机喷溅</button>
  <button id="clear">清空</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 参数（思路参考经典的 GPU Stable Fluids 实现）
const P = { SIM: 128, DYE: innerWidth < 760 ? 512 : 1024, DENSITY_DISS: 1, VELOCITY_DISS: .2, PRESSURE: .8, ITER: 20, CURL: 30, RADIUS: .25, FORCE: 6000 };

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
renderer.autoClear = false;

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quadScene.add(quad);

// ---------- 帧缓冲 ----------
const res = base => { const a = innerWidth / innerHeight; return a > 1 ? [Math.round(base * a), base] : [base, Math.round(base / a)]; };
const makeRT = ([w, h]) => new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping });
const makeDouble = size => { const o = { read: makeRT(size), write: makeRT(size), size, swap() { [o.read, o.write] = [o.write, o.read]; } }; return o; };
let simSize, dyeSize, velocity, dye, pressure, divergence, curlRT;
function initFBOs() {
  simSize = res(P.SIM); dyeSize = res(P.DYE);
  velocity = makeDouble(simSize); dye = makeDouble(dyeSize); pressure = makeDouble(simSize);
  divergence = makeRT(simSize); curlRT = makeRT(simSize);
}
initFBOs();
const texel = s => new THREE.Vector2(1 / s[0], 1 / s[1]);

// ---------- 着色器 ----------
const VS = /* glsl */`
  varying vec2 vUv, vL, vR, vT, vB; uniform vec2 texelSize;
  void main(){
    vUv = uv; vL = vUv - vec2(texelSize.x, 0.); vR = vUv + vec2(texelSize.x, 0.);
    vT = vUv + vec2(0., texelSize.y); vB = vUv - vec2(0., texelSize.y);
    gl_Position = vec4(position.xy, 0., 1.);
  }`;
const HEAD = 'precision highp float; varying vec2 vUv, vL, vR, vT, vB; uniform vec2 texelSize;\n';
const mat = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: HEAD + fs, uniforms: { texelSize: { value: new THREE.Vector2() }, ...uniforms }, depthTest: false, depthWrite: false });
const T = () => ({ value: null }), F = v => ({ value: v });

const M = {
  splat: mat(`uniform sampler2D uTarget; uniform float aspect, radius; uniform vec3 color; uniform vec2 point;
    void main(){ vec2 p = vUv - point; p.x *= aspect; vec3 s = exp(-dot(p, p) / radius) * color; gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + s, 1.); }`,
    { uTarget: T(), aspect: F(1), radius: F(.0025), color: F(new THREE.Vector3()), point: F(new THREE.Vector2()) }),
  advect: mat(`uniform sampler2D uVelocity, uSource; uniform vec2 velTexel; uniform float dt, dissipation;
    void main(){ vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * velTexel; gl_FragColor = texture2D(uSource, coord) / (1. + dissipation * dt); }`,
    { uVelocity: T(), uSource: T(), velTexel: F(new THREE.Vector2()), dt: F(.016), dissipation: F(1) }),
  divergence: mat(`uniform sampler2D uVelocity;
    void main(){
      float L = texture2D(uVelocity, vL).x, R = texture2D(uVelocity, vR).x, Tp = texture2D(uVelocity, vT).y, B = texture2D(uVelocity, vB).y;
      vec2 C = texture2D(uVelocity, vUv).xy;
      if (vL.x < 0.) L = -C.x; if (vR.x > 1.) R = -C.x; if (vT.y > 1.) Tp = -C.y; if (vB.y < 0.) B = -C.y;
      gl_FragColor = vec4(.5 * (R - L + Tp - B), 0., 0., 1.);
    }`, { uVelocity: T() }),
  curl: mat(`uniform sampler2D uVelocity;
    void main(){ float L = texture2D(uVelocity, vL).y, R = texture2D(uVelocity, vR).y, Tp = texture2D(uVelocity, vT).x, B = texture2D(uVelocity, vB).x;
      gl_FragColor = vec4(.5 * (R - L - Tp + B), 0., 0., 1.); }`, { uVelocity: T() }),
  vorticity: mat(`uniform sampler2D uVelocity, uCurl; uniform float curl, dt;
    void main(){
      float L = texture2D(uCurl, vL).x, R = texture2D(uCurl, vR).x, Tp = texture2D(uCurl, vT).x, B = texture2D(uCurl, vB).x, C = texture2D(uCurl, vUv).x;
      vec2 force = .5 * vec2(abs(Tp) - abs(B), abs(R) - abs(L));
      force /= length(force) + .0001; force *= curl * C; force.y *= -1.;
      vec2 v = texture2D(uVelocity, vUv).xy + force * dt;
      gl_FragColor = vec4(clamp(v, -1000., 1000.), 0., 1.);
    }`, { uVelocity: T(), uCurl: T(), curl: F(P.CURL), dt: F(.016) }),
  clear: mat(`uniform sampler2D uTexture; uniform float value; void main(){ gl_FragColor = value * texture2D(uTexture, vUv); }`, { uTexture: T(), value: F(P.PRESSURE) }),
  pressure: mat(`uniform sampler2D uPressure, uDivergence;
    void main(){ float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x, Tp = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
      gl_FragColor = vec4((L + R + B + Tp - texture2D(uDivergence, vUv).x) * .25, 0., 0., 1.); }`, { uPressure: T(), uDivergence: T() }),
  gradient: mat(`uniform sampler2D uPressure, uVelocity;
    void main(){ float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x, Tp = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
      gl_FragColor = vec4(texture2D(uVelocity, vUv).xy - vec2(R - L, Tp - B), 0., 1.); }`, { uPressure: T(), uVelocity: T() }),
};
// 显示：墨水颜色 + 由亮度梯度推出的浮雕光照
const display = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat(`uniform sampler2D uTexture;
  void main(){
    vec3 c = texture2D(uTexture, vUv).rgb;
    float dx = length(texture2D(uTexture, vR).rgb) - length(texture2D(uTexture, vL).rgb);
    float dy = length(texture2D(uTexture, vT).rgb) - length(texture2D(uTexture, vB).rgb);
    vec3 n = normalize(vec3(dx, dy, length(texelSize)));
    c *= clamp(dot(n, vec3(0., 0., 1.)) + .7, .7, 1.);
    gl_FragColor = vec4(pow(c * 1.7, vec3(.85)), 1.);
  }`, { uTexture: T() }));
const displayScene = new THREE.Scene(); displayScene.add(display);

function blit(target, m, size) {
  m.uniforms.texelSize.value.copy(texel(size));
  quad.material = m;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, cam);
}

// ---------- 喷溅 ----------
const PALETTES = {
  neon: t => new THREE.Color().setHSL(.5 + .38 * (Math.sin(t) * .5 + .5), 1, .5),
  rainbow: t => new THREE.Color().setHSL((t * .12) % 1, 1, .5),
  lava: t => new THREE.Color().setHSL(.02 + .1 * (Math.sin(t * 1.3) * .5 + .5), 1, .5),
  ocean: t => new THREE.Color().setHSL(.52 + .12 * (Math.sin(t * .9) * .5 + .5), 1, .5),
};
let palette = 'neon', sym = false, hueT = 0;
const nextColor = (k = .2) => { hueT += .7 + Math.random() * .5; const c = PALETTES[palette](hueT); return new THREE.Vector3(c.r * k, c.g * k, c.b * k); };

function splatOne(x, y, dx, dy, color, radius = P.RADIUS) {
  const aspect = innerWidth / innerHeight, s = M.splat.uniforms;
  s.aspect.value = aspect;
  s.radius.value = radius / 100 * (aspect > 1 ? aspect : 1);
  s.point.value.set(x, y);
  s.uTarget.value = velocity.read.texture; s.color.value.set(dx, dy, 0);
  blit(velocity.write, M.splat, simSize); velocity.swap();
  s.uTarget.value = dye.read.texture; s.color.value.copy(color);
  blit(dye.write, M.splat, dyeSize); dye.swap();
}
// 万花筒：四向镜像喷溅
function splat(x, y, dx, dy, color, radius) {
  splatOne(x, y, dx, dy, color, radius);
  if (!sym) return;
  splatOne(1 - x, y, -dx, dy, color, radius);
  splatOne(x, 1 - y, dx, -dy, color, radius);
  splatOne(1 - x, 1 - y, -dx, -dy, color, radius);
}
function randomSplats(n) {
  for (let i = 0; i < n; i++) {
    const c = nextColor(1.2);
    splat(Math.random(), Math.random(), 1000 * (Math.random() - .5), 1000 * (Math.random() - .5), c, P.RADIUS * (1 + Math.random()));
  }
}

// ---------- 交互 ----------
const ptr = { x: 0, y: 0, down: false, moved: false, color: nextColor() };
const toUv = e => [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
renderer.domElement.addEventListener('pointerdown', e => {
  [ptr.x, ptr.y] = toUv(e); ptr.down = true; ptr.color = nextColor();
  splat(ptr.x, ptr.y, (Math.random() - .5) * 800, (Math.random() - .5) * 800, nextColor(1.4), P.RADIUS * 1.6);
});
addEventListener('pointermove', e => {
  const [x, y] = toUv(e);
  const dx = (x - ptr.x) * P.FORCE, dy = (y - ptr.y) * P.FORCE;
  ptr.x = x; ptr.y = y;
  if (e.target !== renderer.domElement || (Math.abs(dx) + Math.abs(dy) === 0)) return;
  ptr.moved = true; ptr.dx = dx; ptr.dy = dy;
});
addEventListener('pointerup', () => { ptr.down = false; });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); randomSplats(6); } });

const ctrl = document.getElementById('ctrl');
ctrl.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { palette = b.dataset.p; ctrl.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b)); randomSplats(4); });
const symBtn = document.getElementById('sym');
symBtn.onclick = () => { sym = !sym; symBtn.classList.toggle('on', sym); };
document.getElementById('burst').onclick = () => randomSplats(8);
document.getElementById('clear').onclick = () => {
  [dye, velocity, pressure].forEach(d => { M.clear.uniforms.value.value = 0; M.clear.uniforms.uTexture.value = d.read.texture; blit(d.write, M.clear, d.size); d.swap(); });
};

// ---------- 后期 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(displayScene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .7, .5, .2));
composer.addPass(new OutputPass());

// ---------- 求解循环 ----------
function step(dt) {
  M.curl.uniforms.uVelocity.value = velocity.read.texture; blit(curlRT, M.curl, simSize);
  Object.assign(M.vorticity.uniforms, {}); M.vorticity.uniforms.uVelocity.value = velocity.read.texture; M.vorticity.uniforms.uCurl.value = curlRT.texture; M.vorticity.uniforms.dt.value = dt;
  blit(velocity.write, M.vorticity, simSize); velocity.swap();
  M.divergence.uniforms.uVelocity.value = velocity.read.texture; blit(divergence, M.divergence, simSize);
  M.clear.uniforms.uTexture.value = pressure.read.texture; M.clear.uniforms.value.value = P.PRESSURE; blit(pressure.write, M.clear, simSize); pressure.swap();
  M.pressure.uniforms.uDivergence.value = divergence.texture;
  for (let i = 0; i < P.ITER; i++) { M.pressure.uniforms.uPressure.value = pressure.read.texture; blit(pressure.write, M.pressure, simSize); pressure.swap(); }
  M.gradient.uniforms.uPressure.value = pressure.read.texture; M.gradient.uniforms.uVelocity.value = velocity.read.texture;
  blit(velocity.write, M.gradient, simSize); velocity.swap();
  const a = M.advect.uniforms;
  a.velTexel.value.copy(texel(simSize)); a.dt.value = dt;
  a.uVelocity.value = velocity.read.texture; a.uSource.value = velocity.read.texture; a.dissipation.value = P.VELOCITY_DISS;
  blit(velocity.write, M.advect, simSize); velocity.swap();
  a.uVelocity.value = velocity.read.texture; a.uSource.value = dye.read.texture; a.dissipation.value = P.DENSITY_DISS;
  blit(dye.write, M.advect, dyeSize); dye.swap();
}

randomSplats(10);
let last = performance.now(), idle = 0, lastBeat = 0;
(function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 60); last = now;
  if (ptr.moved) { ptr.moved = false; splat(ptr.x, ptr.y, ptr.dx, ptr.dy, ptr.color); idle = 0; ptr.color.lerp(nextColor(), .02); }
  // 无人操作时缓慢自动喷溅；开着音乐时跟随底鼓喷溅
  idle += dt;
  if (idle > 2.5) { idle = 0; randomSplats(1); }
  const beat = window.BGM?.pulse?.() || 0;
  if (beat > .9 && lastBeat < .8) {
    const a = Math.random() * Math.PI * 2;
    splat(.5 + Math.cos(a) * .25, .5 + Math.sin(a) * .25, -Math.cos(a) * 900, -Math.sin(a) * 900, nextColor(1), P.RADIUS * 1.4);
  }
  lastBeat = beat;
  step(dt);
  renderer.setRenderTarget(null);
  display.material.uniforms.uTexture.value = dye.read.texture;
  display.material.uniforms.texelSize.value.copy(texel(dyeSize));
  composer.render();
  requestAnimationFrame(loop);
})(last);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  initFBOs(); randomSplats(6);
});
</script>
<script src="shared.js"></script>
</body>
</html>
