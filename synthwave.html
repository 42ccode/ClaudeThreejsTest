<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>霓虹公路 · Neon Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0019; color: #fff; font-family: "Inter", "PingFang SC", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .head { position: absolute; top: 12vh; left: 0; right: 0; text-align: center; }
  .glitch { position: relative; display: inline-block; font-size: clamp(54px, 11vw, 170px); font-weight: 900; font-style: italic; letter-spacing: .02em;
    background: linear-gradient(180deg, #fff 0%, #7cf7ff 45%, #ff2a9d 55%, #ffb547 100%); -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px #ff2a9d88); }
  .glitch::before, .glitch::after { content: attr(data-t); position: absolute; inset: 0; background: inherit; -webkit-background-clip: text; color: transparent; }
  .glitch::before { animation: g1 3s infinite steps(1); text-shadow: -3px 0 #0ff; }
  .glitch::after { animation: g2 2.4s infinite steps(1); text-shadow: 3px 0 #f0f; }
  @keyframes g1 { 0%,86%,100% { clip-path: inset(0 0 100% 0); transform: none; } 88% { clip-path: inset(20% 0 55% 0); transform: translateX(-8px); } 92% { clip-path: inset(60% 0 10% 0); transform: translateX(6px); } }
  @keyframes g2 { 0%,80%,100% { clip-path: inset(0 0 100% 0); transform: none; } 83% { clip-path: inset(40% 0 35% 0); transform: translateX(10px); } 90% { clip-path: inset(5% 0 80% 0); transform: translateX(-5px); } }
  .tag { margin-top: 6px; font-size: 13px; letter-spacing: .8em; color: #ffd1f0; text-shadow: 0 0 10px #ff2a9d; }
  .dash { position: absolute; left: 5vw; bottom: 36px; font-family: "SF Mono", ui-monospace, monospace; }
  .dash .spd { font-size: 56px; font-weight: 200; color: #7cf7ff; text-shadow: 0 0 16px #7cf7ff; line-height: 1; }
  .dash small { font-size: 11px; letter-spacing: .3em; color: #ffd1f0; }
  .player { position: absolute; right: 180px; bottom: 36px; display: flex; align-items: flex-end; gap: 14px; font-size: 11px; letter-spacing: .2em; color: #ffd1f0; text-align: right; line-height: 1.8; }
  .eq { display: flex; gap: 3px; height: 34px; align-items: flex-end; }
  .eq i { width: 4px; background: linear-gradient(#ff2a9d, #7cf7ff); animation: eq .9s ease-in-out infinite alternate; }
  @keyframes eq { from { height: 10%; } to { height: 100%; } }
  .hint { position: absolute; top: 28px; left: 5vw; font-size: 11px; letter-spacing: .3em; color: #ffd1f0aa; }
  .scan { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: repeating-linear-gradient(0deg, #0000 0 2px, #0003 2px 3px); mix-blend-mode: multiply; }
  @media (max-width: 700px) { .player { display: none; } .dash { left: 16px; bottom: 24px; } .dash .spd { font-size: 40px; } .hint { left: 16px; } .tag { letter-spacing: .4em; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <div class="hint">NEON DRIVE / 05 · 按住加速 · 移动鼠标驾驶跑车</div>
  <div class="head"><div class="glitch" data-t="NEON DRIVE">NEON DRIVE</div><div class="tag">霓 虹 公 路</div></div>
  <div class="dash"><div class="spd" id="spd">120</div><small>KM/H · TURBO <span id="turbo">OFF</span></small></div>
  <div class="player">
    <div>NOW PLAYING<br><b style="color:#fff">午夜霓虹 — Nebula Trap</b></div>
    <div class="eq" id="eq"></div>
  </div>
</div>
<div class="scan"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildCar, radialGlow, linearGlow } from './car.js';

const eq = document.getElementById('eq');
for (let i = 0; i < 12; i++) { const b = document.createElement('i'); b.style.animationDelay = (-Math.random()).toFixed(2) + 's'; b.style.animationDuration = (0.4 + Math.random() * 0.6).toFixed(2) + 's'; eq.appendChild(b); }

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 2.2, 5.2);

const u = { uTime: { value: 0 }, uTravel: { value: 0 }, uBeat: { value: 0 } };

// 天空
const sky = new THREE.Mesh(new THREE.PlaneGeometry(800, 300), new THREE.ShaderMaterial({
  uniforms: u, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv; uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float y = vUv.y;
      vec3 c = mix(vec3(.9,.15,.55), vec3(.25,.03,.35), smoothstep(.0, .25, y - .02));
      c = mix(c, vec3(.03,.0,.08), smoothstep(.25, .7, y));
      vec2 g = vUv * vec2(400., 150.); vec2 id = floor(g);
      float s = step(.993, hash(id)) * smoothstep(.3, .6, y) * (.5 + .5*sin(uTime*3. + hash(id)*50.));
      c += s * smoothstep(.25, 0., length(fract(g) - .5));
      gl_FragColor = vec4(c, 1.);
    }`,
}));
sky.position.set(0, 60, -200);
scene.add(sky);

// 落日
const sun = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShaderMaterial({
  uniforms: u, transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv; uniform float uTime, uBeat;
    void main(){
      vec2 p = vUv - .5; float r = length(p);
      float disk = smoothstep(.36, .355, r);
      float y = vUv.y;
      float cut = (y < .52) ? step(fract(y*16. - uTime*.35), (.52 - y)*1.6) : 0.;
      vec3 c = mix(vec3(1., .15, .55), vec3(1., .9, .3), smoothstep(.15, .85, y));
      float glow = exp(-max(r - .33, 0.)*14.) * .3 * (1. + uBeat*.5);
      float a = disk*(1. - cut) + glow*(1. - disk);
      gl_FragColor = vec4(c * (.85 + uBeat*.15), a);
    }`,
}));
sun.position.set(0, 13, -150);
scene.add(sun);

// 地形：中间公路，两侧霓虹山脉
const tGeo = new THREE.PlaneGeometry(80, 160, 200, 320);
tGeo.rotateX(-Math.PI / 2);
tGeo.translate(0, 0, -76);
const terrain = new THREE.Mesh(tGeo, new THREE.ShaderMaterial({
  uniforms: u,
  vertexShader: /* glsl */`
    uniform float uTravel, uBeat;
    varying vec2 vG; varying float vH, vFog, vX;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
    void main(){
      vec3 p = position;
      float z = p.z - uTravel;
      float side = smoothstep(3.5, 9., abs(p.x));
      float h = noise(vec2(p.x*.18, z*.18))*3.2 + noise(vec2(p.x*.5, z*.5))*1.1 + noise(vec2(p.x*1.3, z*1.3))*.3;
      h *= side * (.5 + abs(p.x)*.09) * (1. + uBeat*.15);
      p.y += h;
      vH = h; vG = vec2(p.x, z); vX = p.x;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      vFog = smoothstep(20., 150., -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uBeat;
    varying vec2 vG; varying float vH, vFog, vX;
    void main(){
      vec2 g = abs(fract(vG - .5) - .5) / fwidth(vG);
      float line = 1. - min(min(g.x, g.y), 1.);
      vec3 lc = mix(vec3(1., .16, .7), vec3(.25, .95, 1.), clamp(vH/4., 0., 1.));
      vec3 c = vec3(.04, .0, .09) + vec3(.15, .0, .2) * vH * .15;
      c += lc * line * (.7 + uBeat*.4);
      float road = 1. - smoothstep(2.6, 2.8, abs(vX));
      c = mix(c, vec3(.02, .0, .05) + lc*line*.5, road*.7);
      float edge = smoothstep(.12, 0., abs(abs(vX) - 2.7));
      c += vec3(.25, .95, 1.) * edge * .8;
      float dashL = step(abs(vX), .08) * step(fract(vG.y*.15), .5);
      c += vec3(1., .85, .4) * dashL * .9;
      c = mix(c, vec3(.55, .08, .45), vFog);
      gl_FragColor = vec4(c, 1.);
    }`,
}));
scene.add(terrain);

// 霓虹灯柱
const poles = [];
const poleGeo = new THREE.BoxGeometry(0.08, 3, 0.08);
for (let i = 0; i < 24; i++) {
  const m = new THREE.Mesh(poleGeo, new THREE.MeshBasicMaterial({ color: i % 2 ? 0x7cf7ff : 0xff2a9d }));
  m.position.set(i % 2 ? 3.3 : -3.3, 1.5, -i * 6);
  poles.push(m); scene.add(m);
}

// 科幻跑车
const { car, wheels, core, M } = buildCar();
// 这里的泛光阈值低，车漆反射需要收敛
M.paint.clearcoat = .25; M.paint.envMapIntensity = .45; M.paint.roughness = .35; M.glass.envMapIntensity = .4;
car.position.set(0, 0, -1);
scene.add(car);
const addGlow = (geo, tex, opacity, pos, color = 0xffffff) => {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(...pos); car.add(m); return m;
};
const under = addGlow(new THREE.PlaneGeometry(2.1, 4.9), radialGlow('rgba(95,248,255,1)'), .2, [0, .03, 0]);
addGlow(new THREE.PlaneGeometry(1.9, 8), linearGlow('rgba(200,250,255,1)', true), .16, [0, .04, -6.3]);
const trails = [-.6, .6].map(x => addGlow(new THREE.PlaneGeometry(.05, 1), linearGlow('rgba(255,61,187,1)'), .35, [x, .82, 2.8]));
trails.forEach(tr => tr.rotation.x = -Math.PI / 2);

// 车漆反射用的落日环境
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; void main(){ float y = normalize(vP).y;
    vec3 c = mix(vec3(1.,.3,.65), vec3(.15,.02,.3), smoothstep(0., .6, y));
    c = mix(c, vec3(.03,0.,.06), smoothstep(0., -.3, y));
    c += vec3(.3,.95,1.) * smoothstep(.03, 0., abs(y + .05)) * 2.;
    gl_FragColor = vec4(c, 1.); }`,
})));
scene.environment = pmrem.fromScene(envScene, 0).texture;
scene.add(new THREE.HemisphereLight(0xff6ad5, 0x1a0630, .7));
const sunLight = new THREE.DirectionalLight(0xffa0c8, .9); sunLight.position.set(0, 6, -20); scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x5ff8ff, 1.2); fillLight.position.set(-4, 3, 8); scene.add(fillLight);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.45);
composer.addPass(bloom);
composer.addPass(new OutputPass());
window.NEBULA?.adaptive(r => { renderer.setPixelRatio(r); composer.setPixelRatio(r); });

// 控制
let boost = false, speed = 14;
const mouse = new THREE.Vector2();
addEventListener('pointermove', e => mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));
addEventListener('pointerdown', e => { if (!e.target.closest('button,a,nav')) boost = true; });
addEventListener('pointerup', () => boost = false);
addEventListener('pointercancel', () => boost = false);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') boost = true; });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') boost = false; });

const spdEl = document.getElementById('spd'), turboEl = document.getElementById('turbo');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  speed += ((boost ? 55 : 14) - speed) * 0.03;
  u.uTime.value = t;
  u.uTravel.value -= speed * dt;
  // 节拍脉冲：播放音乐时跟随真实底鼓，否则按固定节奏
  u.uBeat.value = window.BGM?.playing ? BGM.pulse() : Math.pow(1 - ((t * 2) % 1), 4);

  poles.forEach(p => { p.position.z += speed * dt; if (p.position.z > 6) p.position.z -= 24 * 6; });

  const k = (speed - 14) / 41;
  // 跑车：鼠标转向，带偏航、侧倾和轮胎转动
  const dx = mouse.x * 1.7 - car.position.x;
  car.position.x += dx * 0.06;
  car.position.y = Math.sin(t * 25) * 0.006 * (1 + k * 2);
  car.rotation.y = THREE.MathUtils.clamp(-dx * 0.35, -0.4, 0.4);
  car.rotation.z = THREE.MathUtils.clamp(dx * 0.08, -0.12, 0.12);
  wheels.forEach(w => w.rotation.x -= speed * dt / 0.4);
  core.rotation.y += dt * (2 + k * 8);
  const len = 1 + k * 9;
  trails.forEach(tr => { tr.scale.y = len; tr.position.z = 2.33 + len / 2; });
  under.material.opacity = 0.14 + u.uBeat.value * 0.12;

  // 追尾镜头
  camera.position.x += (car.position.x * 0.7 - camera.position.x) * 0.05;
  camera.position.y = 2.1 + mouse.y * 0.3 - k * 0.3 + Math.sin(t * 20) * 0.01 * k;
  camera.position.z = 5.2 + k * 0.9;
  camera.fov = 60 + k * 22; camera.updateProjectionMatrix();
  camera.lookAt(car.position.x * 0.6, 1.1, -30);
  camera.rotation.z -= dx * 0.03;
  sun.scale.setScalar(1 + u.uBeat.value * 0.03);
  bloom.strength = 0.6 + u.uBeat.value * 0.15 + k * 0.4;

  spdEl.textContent = Math.round(speed * 8.6);
  turboEl.textContent = k > 0.5 ? 'ON' : 'OFF';
  composer.render();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
