<style>

  .top span { font-size: 12px; letter-spacing: .3em; color: #8b90b8; }
  .info { position: fixed; left: 5vw; bottom: 40px; z-index: 2; max-width: 520px; }
  .num { font-size: 12px; letter-spacing: .4em; color: #7cf7ff; }
  .num b { color: #fff; }
  .name { font-size: clamp(40px, 6vw, 84px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; margin: 8px 0 10px; overflow: hidden; }
  .name span { display: inline-block; animation: up .8s cubic-bezier(.2,.9,.2,1) both; }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 第 5 项是预览着色器编号（pid），与卡片在列表中的位置无关
const WORKS = [
  ['liquid.html', '液态金属', 'Liquid', '纯片元着色器光线步进，有向距离场平滑融合出液滴，幻彩薄膜、黄金与果冻三种材质。', 1],
  ['blackhole.html', '事件视界', 'Black Hole', 'OGL 驱动的实时广义相对论光线追踪：引力透镜、光子环与多普勒增亮的吸积盘。', 5],
  ['fluid.html', '流体墨水', 'Fluid', 'GPU 上实时求解 Navier–Stokes 方程：涡度约束让墨水卷起漩涡，万花筒镜像与随底鼓喷溅。', 9],
  ['reaction.html', '反应扩散', 'Reaction', 'Gray–Scott 反应扩散方程：两种物质相互吞噬与补给，自组织出珊瑚、迷宫与细胞分裂。', 11],
  ['aurora.html', '极光', 'Aurora', '北极圈的夜：一层层光帘在头顶舞动，倒映在静止的湖面，偶尔划过一颗流星。', 15],
  ['ocean.html', '落日海洋', 'Ocean', '光线步进实时计算的海浪：日落、黄昏与月夜三种天色，浪尖透光、海面碎金。', 17],
  ['index.html', '粒子宇宙', 'Particles', '两万颗 GPU 粒子在五种形态间变形，鼠标排斥、点击释放冲击波，滚动驱动整段叙事。', 0],
  ['tunnel.html', '超空间跃迁', 'Warp', '按住鼠标启动引擎：视场角拉伸、色差、径向模糊与镜头震动，冲进星光隧道。', 2],
  ['text.html', '粒子文字', 'Typography', '输入任意文字，粒子以弹簧物理飞来组字，支持爆炸、漩涡与重力坍塌。', 3],
  ['boids.html', '鱼群', 'Boids', '1600 条鱼只遵守分离、对齐、聚合三条规则，就能结成会躲避捕食者的鱼群；可调规则权重。', 14],
  ['fireworks.html', '烟花', 'Fireworks', '点击夜空任意位置发射：牡丹、光环、爱心、垂柳与分裂弹，残影拖尾映在水面。', 18],
  ['galaxy.html', '星系碰撞', 'Galaxy Merger', '两万六千颗恒星组成的两个旋涡星系擦肩而过，引力撕扯出长长的潮汐尾。', 19],
  ['synthwave.html', '霓虹公路', 'Neon Drive', '驾驶科幻跑车驶过程序化霓虹山脉，条纹落日随 trap 底鼓脉动，按住加速。', 4],
  ['garage.html', '跑车解构', 'Garage', '概念超跑 NX-07：爆炸视图、平铺陈列、点击部件聚焦详情，X 光全息与五款车漆。', 8],
  ['sonic.html', '声波星球', 'Sonic Planet', 'FFT 频谱实时驱动星球地形：赤道是低音、两极是高音，底鼓触发粒子喷发。', 10],
  ['cube.html', '霓虹魔方', 'Cube', '可拖动转层的 3×3 魔方：一键打乱、自动还原、计时挑战，还原后放彩带庆祝。', 12],
  ['planet.html', '迷你星球', 'Tiny Planet', '低多边形小星球：点击陆地种树、盖小屋，昼夜交替，入夜后小屋亮起灯。', 20],
  ['city.html', '赛博城市', 'Cyber City', '雨夜飞越霓虹楼群：万家灯火、悬挂招牌、多层悬浮车流，按住加速。', 21],
  ['physics.html', '物理实验室', 'Physics Lab', 'Babylon.js + Havok 刚体物理：蓄力发射能量球、引力炸弹与慢动作，推倒霓虹积木塔。', 6],
  ['gravity.html', '失重网页', 'Gravity', 'Matter.js 把整张网页变成刚体：开启重力后文字与卡片纷纷坠落，可拖拽抛掷、一键复原。', 7],
  ['cloth.html', '撕裂布料', 'Cloth', '两千个 Verlet 质点织成的霓虹网：拉扯到极限就会断裂，也能用剪刀一刀剪开。', 13],
  ['sand.html', '落沙世界', 'Sand', '像素元胞自动机：沙、水、岩浆、火、植物、油会坠落、流动、燃烧与凝固，用鼠标作画。', 16],
  ['plinko.html', '高尔顿板', 'Galton Board', '小球在钉阵中随机左右弹跳，千百次之后落点自己排成钟形曲线。', 22],
  ['jelly.html', '果冻软体', 'Jelly', '形状匹配软体物理：会眨眼、会盯着你看的 Q 弹果冻，抓起来甩出去。', 23],
];
// 弧形排布：卡片按固定角度间隔排开，只显示当前卡片左右各约 3 张
const N = WORKS.length, GAP = .6, R = 7.2, SHOW = 3.4;
const CATS = [['着色器', 0], ['粒子', 6], ['3D 场景', 12], ['物理', 18]];

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04030a, 0.045);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
const fit = () => { camera.position.set(0, 0.8, R + (camera.aspect < 1 ? 13 : 9)); };
fit();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.2));
composer.addPass(new OutputPass());
window.NEBULA?.adaptive(r => { renderer.setPixelRatio(r); composer.setPixelRatio(r); });

// 卡片着色器：每张卡片实时渲染对应作品的“预告片”
const cardVS = /* glsl */`
  uniform float uTime, uHover; varying vec2 vUv;
  void main(){
    vUv = uv; vec3 p = position;
    float k = uv.x - .5; p.z -= k*k*1.4;
    p.z += sin(uv.y*9. + uTime*4.) * .08 * uHover;
    p.x += sin(uv.y*6. + uTime*3.) * .04 * uHover;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
  }`;
const cardFS = /* glsl */`
  uniform float uTime, uIdx, uHover, uFocus; uniform sampler2D uTex; varying vec2 vUv;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  const vec3 CY = vec3(.49,.97,1.), PK = vec3(1.,.37,.82);
  vec3 pal(float t){ return .5 + .5*cos(6.2831*(t + vec3(0.,.33,.67))); }
  void main(){
    vec2 uv = vUv; float t = uTime; vec3 col = vec3(.02,.02,.05);
    vec2 a = (uv - vec2(.5,.6)) * vec2(1., 1.35);
    if (uIdx < .5) {
      vec2 g = uv*vec2(34.,46.); vec2 id = floor(g); vec2 f = fract(g) - .5; float h = hash(id);
      float r = length(a) + sin(t + h*6.)*.01;
      float tw = .5 + .5*sin(t*2. + h*40.);
      col += mix(CY, PK, uv.y) * smoothstep(.28, 0., length(f)) * (step(r, .3)*(.4 + tw*(1. - r*2.)) + .06);
    } else if (uIdx < 1.5) {
      float v = 0.;
      for (int k = 0; k < 5; k++) { float fk = float(k);
        vec2 c = vec2(sin(t*.7 + fk*2.1), cos(t*.6 + fk*1.3)) * .25;
        v += .012 / dot(a - c, a - c); }
      float m = smoothstep(.9, 1.2, v);
      col = mix(col, pal(v*.15 + t*.1 + uv.y) * (.6 + .4*m), m) + pal(t*.1) * smoothstep(.3, .9, v) * .15;
    } else if (uIdx < 2.5) {
      float ang = atan(a.y, a.x), r = length(a);
      float lane = floor(ang * 8.);
      float s = fract(.25/r + t*1.5 + hash(vec2(lane)));
      float ln = pow(abs(sin(ang*24.)), 40.) * smoothstep(.0, .5, r);
      col += mix(CY, PK, hash(vec2(lane, 1.))) * ln * s * 2. + vec3(1.) * exp(-r*14.)*1.4;
      col += pal(r - t*.4) * smoothstep(.02, 0., abs(fract(r*4. - t*1.5) - .5) - .47) * .5;
    } else if (uIdx < 3.5) {
      vec2 g = uv*vec2(14.,26.); vec2 id = floor(g); vec2 f = fract(g);
      float sp = 1. + hash(vec2(id.x, 3.))*2.;
      float trail = fract(-uv.y*1.4 + t*sp*.25 + hash(vec2(id.x, 7.)));
      float on = step(.4, hash(id + floor(t*6.*sp)));
      float cell = step(.15, f.x)*step(f.x, .85)*step(.15, f.y)*step(f.y, .85);
      col += mix(CY, PK, uv.x) * on * cell * pow(trail, 5.) * 1.6;
    } else if (uIdx < 4.5) {
      col = mix(vec3(.9,.15,.55), vec3(.08,.0,.18), smoothstep(.45, 1., uv.y));
      vec2 sp = uv - vec2(.5, .62); float r = length(sp*vec2(1.,1.35));
      float cut = (uv.y < .64) ? step(fract(uv.y*30. - t*.5), (.64 - uv.y)*4.) : 0.;
      col = mix(col, mix(vec3(1.,.2,.55), vec3(1.,.9,.3), smoothstep(.45,.8,uv.y)), smoothstep(.22,.215,r)*(1. - cut));
      float y = .45 - uv.y;
      if (y > 0.) {
        vec2 gp = vec2((uv.x - .5)/y, .3/y + t*2.);
        vec2 gg = abs(fract(gp) - .5) / fwidth(gp);
        col = vec3(.05,0.,.1) + vec3(1.,.2,.8) * (1. - min(min(gg.x, gg.y), 1.)) * smoothstep(0., .1, y);
      }
    } else if (uIdx > 7.5 && uIdx < 8.5) {
      // 蓝图式爆炸图：方块周期性向外展开再合拢
      col = vec3(.02,.05,.12);
      vec2 gp = uv*vec2(20.,26.); vec2 gg = abs(fract(gp) - .5) / fwidth(gp);
      col += vec3(.1,.35,.7) * (1. - min(min(gg.x, gg.y), 1.)) * .35;
      float e = smoothstep(.15, .85, .5 + .5*sin(t*1.2));
      for (int k = 0; k < 6; k++) { float fk = float(k);
        vec2 dir = vec2(cos(fk*1.047 + .5), sin(fk*1.047 + .5));
        vec2 c = vec2(.5, .62) + dir * .2 * e / vec2(1., 1.35);
        vec2 q = abs((uv - c) * vec2(1., 1.35)) - vec2(.07 + .03*sin(fk*3.), .05 + .02*cos(fk*2.));
        float d = length(max(q, 0.)) + min(max(q.x, q.y), 0.);
        vec3 pc = mix(CY, PK, fk/5.);
        col += pc * smoothstep(.006, 0., abs(d)) * 1.5 + pc * .07 * step(d, 0.);
      }
      col += vec3(1.) * exp(-length((uv - vec2(.5,.62)) * vec2(1.,1.35)) * 18.) * (1. - e*.6);
    }
    if (uIdx > 4.5 && uIdx < 5.5) {
      // 黑洞：侧视吸积盘 + 透镜光环 + 视界
      vec2 q = (uv - vec2(.5, .62)) * vec2(1., 1.35);
      float r = length(q);
      vec2 sg = uv * vec2(60., 80.);
      col = vec3(.012, .01, .008) + step(.986, hash(floor(sg))) * smoothstep(.25, 0., length(fract(sg) - .5)) * vec3(.7);
      vec3 hot = mix(vec3(1., .38, .08), vec3(1., .85, .6), .5 + .5 * sin(t));
      float band = smoothstep(.03, 0., abs(q.y)) * smoothstep(.1, .15, abs(q.x)) * smoothstep(.44, .2, abs(q.x));
      float ring = smoothstep(.022, 0., abs(r - .15));
      float tex = .6 + .4 * sin(q.x * 70. - t * 6.);
      col += hot * (band * tex + ring) * (1. - .55 * q.x / max(r, .01)) * 1.4;
      col *= smoothstep(.1, .116, r);
    } else if (uIdx > 5.5 && uIdx < 6.5) {
      // 物理实验室：两列积木周期性倒塌
      col = vec3(.02, .025, .05);
      float ph = fract(t * .22), fall = smoothstep(.5, .95, ph);
      for (int k = 0; k < 14; k++) { float fk = float(k);
        float lvl = mod(fk, 7.), sk = floor(fk / 7.);
        vec2 c = vec2(.38 + sk * .24, .32 + lvl * .062);
        c += vec2((sk - .5) * fall * .5 * (lvl / 7.), -fall * fall * lvl * .055);
        float ang = fall * (sk - .5) * 2.4 * (lvl / 7.);
        vec2 d = uv - c; d = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * d;
        vec2 qq = abs(d * vec2(1., 1.35)) - vec2(.1, .024);
        float sd = length(max(qq, 0.)) + min(max(qq.x, qq.y), 0.);
        vec3 pc = mix(CY, PK, mod(fk, 2.));
        col += pc * smoothstep(.005, 0., abs(sd)) * 1.3 + pc * .05 * step(sd, 0.);
      }
      col += CY * smoothstep(.004, 0., abs(uv.y - .285)) * .6;
      vec2 bp = vec2(mix(-.1, .45, smoothstep(.3, .52, ph)), .48);
      col += vec3(.6, 1., 1.) * exp(-length((uv - bp) * vec2(1., 1.35)) * 40.) * step(ph, .56);
    } else if (uIdx > 6.5 && uIdx < 7.5) {
      // 失重网页：深色底上的彩色方块坠落堆叠（大厅泛光阈值很低，浅色底会过曝成白板）
      col = vec3(.035, .035, .05);
      col += vec3(1., .85, .3) * .07 * smoothstep(.12, 0., length(fract(uv * vec2(30., 40.)) - .5));
      col += vec3(1., .85, .3) * .35 * smoothstep(.004, 0., abs(uv.y - .265));
      float ph = fract(t * .3);
      for (int k = 0; k < 8; k++) { float fk = float(k);
        vec2 c0 = vec2(.15 + fk * .1, .78 - mod(fk, 2.) * .1);
        float fall = smoothstep(.12 + fk * .03, .5, ph) * (1. - smoothstep(.85, 1., ph));
        vec2 c = mix(c0, vec2(c0.x + (hash(vec2(fk, 2.)) - .5) * .1, .3 + .07 * hash(vec2(fk))), fall);
        float ang = fall * (hash(vec2(fk, 5.)) - .5) * 2.;
        vec2 d = uv - c; d = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * d;
        vec2 qq = abs(d * vec2(1., 1.35)) - vec2(.04, .05);
        float sd = length(max(qq, 0.)) + min(max(qq.x, qq.y), 0.);
        vec3 pc = fk < 2. ? vec3(1., .85, .3) : fk < 4. ? vec3(.49, .97, 1.) : fk < 6. ? vec3(1., .56, .85) : vec3(.72, .64, 1.);
        col = mix(col, pc * .55, step(sd, 0.));
        col = mix(col, pc, smoothstep(.006, 0., abs(sd)));
      }
    } else if (uIdx > 8.5 && uIdx < 9.5) {
      // 流体墨水：多层正弦域扭曲，模拟墨水卷曲
      vec2 p = (uv - .5) * vec2(3., 4.);
      for (int k = 0; k < 5; k++) { float fk = float(k);
        p += .42 * vec2(sin(p.y * 1.7 + t * .5 + fk), cos(p.x * 1.5 - t * .45 + fk * 1.3)); }
      float v = .5 + .5 * sin(p.x * 1.3 + p.y);
      col = mix(vec3(.015, .01, .04), pal(v * .55 + t * .04 + .45) * .85, smoothstep(.2, .95, v));
    } else if (uIdx > 9.5 && uIdx < 10.5) {
      // 声波星球：环形频谱柱 + 随节拍跳动的内圈
      vec2 q = (uv - vec2(.5, .6)) * vec2(1., 1.35);
      float r = length(q), a = atan(q.y, q.x) / 6.2831 + .5;
      float bi = floor(a * 48.), beat = pow(1. - fract(t * 2.33), 4.);
      float h = .04 + .13 * (.5 + .5 * sin(bi * 1.7 + t * 4.)) * (.5 + .5 * sin(bi * .4 - t * 2.)) + beat * .03;
      float bar = step(.17, r) * step(r, .17 + h) * step(.3, fract(a * 48.));
      col = vec3(.02, .012, .04) + mix(CY, PK, abs(a * 2. - 1.)) * bar * 1.1;
      col += mix(CY, PK, .5) * smoothstep(.015, 0., abs(r - .13 - beat * .02)) * .9;
      col += vec3(.3, .5, 1.) * exp(-r * 9.) * .25;
      col += step(.988, hash(floor(uv * vec2(60., 80.)))) * smoothstep(.25, 0., length(fract(uv * vec2(60., 80.)) - .5)) * .5;
    } else if (uIdx > 10.5 && uIdx < 11.5) {
      // 反应扩散：扭曲的迷宫条纹
      vec2 p = uv * vec2(7., 9.);
      for (int k = 0; k < 3; k++) { float fk = float(k);
        p += .35 * vec2(sin(p.y * 1.3 + t * .3 + fk), cos(p.x * 1.1 - t * .25 + fk * 1.7)); }
      float v = sin(p.x * 2.2 + sin(p.y * 1.7) * 1.5);
      col = mix(vec3(.01, .03, .02), vec3(.18, .83, .6), smoothstep(.2, .7, v)) + vec3(.7, 1., .85) * smoothstep(.85, 1., v) * .5;
    } else if (uIdx > 11.5 && uIdx < 12.5) {
      // 魔方：3×3 圆角色块，颜色轮流变化
      col = vec3(.03, .03, .05);
      vec2 q = (uv - vec2(.5, .6)) * vec2(1., 1.35) / .5 + .5;
      if (q.x > 0. && q.x < 1. && q.y > 0. && q.y < 1.) {
        vec2 cell = floor(q * 3.), f = fract(q * 3.) - .5;
        float sq = smoothstep(.05, .03, length(max(abs(f) - .3, 0.)));
        float id = floor(hash(cell + floor(t * .7 + (cell.x + cell.y) * .15)) * 6.);
        vec3 sc = id < 1. ? vec3(1., .18, .33) : id < 2. ? vec3(1., .54, .12) : id < 3. ? vec3(.92) : id < 4. ? vec3(1., .84, .04) : id < 5. ? vec3(.17, 1., .53) : vec3(.18, .55, 1.);
        col = mix(vec3(.05, .05, .07), sc * .85, sq);
      }
    } else if (uIdx > 12.5 && uIdx < 13.5) {
      // 撕裂布料：随风起伏的霓虹网，中间撕开一个洞
      vec2 p = uv; p.x += sin(p.y * 6. + t * 1.5) * .02; p.y += sin(p.x * 5. + t) * .015;
      vec2 gp = p * vec2(18., 24.), gg = abs(fract(gp) - .5) / fwidth(gp);
      float line = 1. - min(min(gg.x, gg.y), 1.);
      float hole = smoothstep(.14, .11, length((uv - vec2(.55, .58 + sin(t * .7) * .03)) * vec2(1., 2.4)));
      col = vec3(.015, .015, .03) + mix(CY, PK, smoothstep(.3, .9, uv.y)) * line * (1. - hole) * .85;
    } else if (uIdx > 13.5 && uIdx < 14.5) {
      // 鱼群：沿起伏轨道盘旋的光点
      col = vec3(.008, .03, .07) + vec3(.05, .15, .35) * (1. - length(uv - vec2(.5, .62)));
      for (int k = 0; k < 48; k++) { float fk = float(k);
        float a = t * (.6 + hash(vec2(fk)) * .4) + fk * .52, r = .12 + .1 * sin(fk * 1.3 + t * .7);
        vec2 p = vec2(.5, .62) + vec2(cos(a), sin(a) * .75) * r / vec2(1., 1.35);
        col += vec3(.35, .9, 1.) * exp(-length((uv - p) * vec2(1., 1.35)) * 140.) * 1.2;
      }
    } else if (uIdx > 14.5 && uIdx < 15.5) {
      // 极光：夜空中摆动的绿色光帘 + 山影 + 湖面倒影
      vec2 q = uv; bool lake = q.y < .32; if (lake) q.y = .64 - q.y;
      col = mix(vec3(.01, .03, .05), vec3(.0, .005, .02), q.y);
      float v = sin(q.x * 9. + sin(q.y * 3. + t * .4) * 2.2 + t * .3);
      float band = pow(max(v, 0.), 5.) * smoothstep(.4, .75, q.y) * smoothstep(1., .8, q.y);
      col += mix(vec3(.2, 1., .55), vec3(.55, .35, 1.), smoothstep(.7, .95, q.y)) * band * .9;
      col += step(.992, hash(floor(q * vec2(70., 90.)))) * .6 * step(.5, q.y);
      if (q.y < .37 + .03 * sin(q.x * 13.) + .02 * sin(q.x * 31.)) col = vec3(.004, .01, .016);
      if (lake) col *= .5;
    } else if (uIdx > 15.5 && uIdx < 16.5) {
      // 落沙：像素沙堆与落下的沙流
      vec2 g = floor(uv * vec2(60., 80.)) / vec2(60., 80.);
      float sh = hash(floor(uv * vec2(60., 80.))) * .15;
      float pile = .28 + .2 * exp(-pow((g.x - .5) / .16, 2.)) * min(t * .05 + .6, 1.);
      col = vec3(.03, .025, .05);
      if (g.y < .22) col = vec3(.2, .55, 1.) * (.75 + sh);
      else if (g.y < pile) col = vec3(.91, .77, .46) * (.8 + sh);
      if (abs(g.x - .5) < .02 && g.y > pile && hash(floor(uv * vec2(60., 80.)) + floor(t * 12.)) > .4) col = vec3(.91, .77, .46);
    } else if (uIdx > 16.5 && uIdx < 17.5) {
      // 落日海洋：渐变天空、落日与波光粼粼的海面
      col = mix(vec3(1., .55, .32), vec3(.18, .2, .45), smoothstep(.5, 1., uv.y));
      float sd = length((uv - vec2(.5, .55)) * vec2(1., 1.35));
      col *= .6;
      col += vec3(1., .8, .5) * (smoothstep(.07, .06, sd) * .9 + exp(-sd * 6.) * .25);
      if (uv.y < .52) {
        float w = sin(uv.x * 40. + sin(uv.y * 60. + t * 2.) * 2. + t) * .5 + .5;
        col = mix(vec3(.02, .08, .14), vec3(.15, .3, .45), (.52 - uv.y) * 1.5) + vec3(1., .7, .4) * pow(w, 8.) * exp(-abs(uv.x - .5) * 9.) * .9;
      }
    } else if (uIdx > 17.5 && uIdx < 18.5) {
      // 烟花：此起彼伏的放射状光点
      col = vec3(.012, .01, .03);
      for (int k = 0; k < 4; k++) { float fk = float(k);
        float ph = fract(t * .35 + fk * .27), seed = floor(t * .35 + fk * .27);
        vec2 c = vec2(.25 + hash(vec2(fk, seed)) * .5, .5 + hash(vec2(seed, fk)) * .35);
        vec2 d = (uv - c) * vec2(1., 1.35); float r = length(d), a = atan(d.y, d.x) / 6.2831;
        float ray = step(.55, fract(a * 28.)) * smoothstep(.012, 0., abs(r - ph * .2));
        col += pal(hash(vec2(seed, fk * 3.))) * ray * (1. - ph) * 1.8 + vec3(1., .8, .5) * exp(-r * 30.) * (1. - ph) * .3;
      }
    } else if (uIdx > 18.5 && uIdx < 19.5) {
      // 星系碰撞：两个旋臂星系
      col = vec3(.005, .005, .015);
      for (int g = 0; g < 2; g++) { float fg = float(g);
        vec2 c = mix(vec2(.36, .55), vec2(.66, .7), fg) + vec2(sin(t * .3), cos(t * .2)) * .03 * (fg * 2. - 1.);
        vec2 d = (uv - c) * vec2(1., 1.35) * (fg > .5 ? vec2(1., 2.2) : vec2(1.));
        float r = length(d), a = atan(d.y, d.x);
        float arm = pow(.5 + .5 * cos(2. * a - log(r + .001) * 5. + t * (fg > .5 ? -.6 : .6)), 4.);
        col += mix(vec3(1., .85, .6), vec3(.5, .65, 1.), smoothstep(0., .15, r)) * (exp(-r * 30.) * 1.2 + arm * exp(-r * 9.) * .7);
      }
    } else if (uIdx > 19.5 && uIdx < 20.5) {
      // 迷你星球：天蓝底上的绿色小行星
      col = mix(vec3(.12, .2, .38), vec3(.05, .08, .2), uv.y);
      vec2 d = (uv - vec2(.5, .58)) * vec2(1., 1.35); float r = length(d);
      if (r < .26) {
        float land = sin(d.x * 18. + t * .5) * sin(d.y * 14.) + sin(d.x * 7. - t * .5 + d.y * 9.) * .7;
        vec3 pc = land > .1 ? vec3(.42, .8, .42) : vec3(.23, .62, 1.);
        col = pc * .7 * (.45 + .55 * max(dot(normalize(vec3(d, sqrt(max(.0676 - r * r, 0.)))), normalize(vec3(-.5, .6, .6))), 0.));
      }
      col += vec3(1.) * smoothstep(.02, 0., abs(r - .3 - .01 * sin(t))) * .25;
    } else if (uIdx > 20.5 && uIdx < 21.5) {
      // 赛博城市：楼群剪影、灯窗与霓虹
      col = mix(vec3(.12, .03, .2), vec3(.02, .01, .05), uv.y);
      float cx = floor(uv.x * 14.), h = .3 + hash(vec2(cx, 1.)) * .45;
      if (uv.y < h) {
        col = vec3(.03, .02, .06);
        vec2 w = fract(uv * vec2(14. * 4., 60.));
        float lit = step(.55, hash(floor(uv * vec2(56., 60.)))) * step(.25, w.x) * step(w.x, .75) * step(.3, w.y) * step(w.y, .7);
        col += mix(vec3(1., .75, .45), vec3(.45, .85, 1.), hash(vec2(cx, 3.))) * lit * .8;
        col += mix(PK, CY, hash(vec2(cx, 5.))) * smoothstep(.006, 0., abs(uv.y - h)) * 1.5;
      }
      col += vec3(.6, .7, 1.) * step(.97, hash(floor(uv * vec2(80., 20.)) + floor(t * 6.))) * .15;
    } else if (uIdx > 21.5 && uIdx < 22.5) {
      // 高尔顿板：三角钉阵 + 钟形柱状图
      col = vec3(.02, .025, .05);
      vec2 g = uv * vec2(20., 28.); vec2 id = floor(g), f = fract(g) - .5;
      float row = 27. - id.y;
      if (row >= 0. && row < 10. && abs(id.x - 9.5 + mod(row, 2.) * .5) < row * .5 + 1.)
        col += vec3(.62, .69, 1.) * smoothstep(.18, .08, length(f));
      float bx = (uv.x - .5) * 6.;
      float hb = exp(-bx * bx / 2.) * .3 * (.85 + .15 * sin(t + floor(uv.x * 20.)));
      if (uv.y > .22 && uv.y < .22 + hb && fract(uv.x * 20.) > .12) col = mix(vec3(1., .85, .3), vec3(1., .48, .24), (uv.y - .22) / .3);
      col += CY * smoothstep(.006, 0., abs(uv.y - .22 - exp(-bx * bx / 2.) * .3)) * step(.2, uv.y);
    } else if (uIdx > 22.5) {
      // 果冻：三只弹跳的圆胖果冻，带眼睛
      col = vec3(.05, .035, .09);
      for (int k = 0; k < 3; k++) { float fk = float(k);
        float bounce = abs(sin(t * 2. + fk * 1.7));
        vec2 c = vec2(.25 + fk * .25, .32 + bounce * .2);
        vec2 d = (uv - c) * vec2(1., 1.35) * vec2(1. - (1. - bounce) * .15, 1. + (1. - bounce) * .2);
        float r = length(d);
        vec3 jc = fk < .5 ? vec3(1., .44, .71) : fk < 1.5 ? vec3(.37, .85, 1.) : vec3(1., .78, .3);
        col = mix(col, jc * (1.1 - r * 3.), smoothstep(.1, .095, r));
        for (int e = 0; e < 2; e++) { vec2 ed = d - vec2(float(e) * .06 - .03, .015); col = mix(col, vec3(1.), smoothstep(.018, .014, length(ed))); col = mix(col, vec3(.1), smoothstep(.009, .006, length(ed - vec2(0., -.004)))); }
      }
      col += vec3(1., .56, .85) * smoothstep(.004, 0., abs(uv.y - .22)) * .6;
    }
    // 标题贴图
    vec2 tuv = vec2(uv.x, (uv.y - .03) / .185);
    if (tuv.y > 0. && tuv.y < 1.) { vec4 tx = texture2D(uTex, tuv); col = mix(col*.35, vec3(1.), tx.a); }
    else if (uv.y < .25) col *= mix(.35, 1., smoothstep(.03, .25, uv.y));
    // 边框辉光
    float e = max(abs(uv.x - .5), abs(uv.y - .5)) * 2.;
    col += mix(CY, PK, uv.y + sin(t)*.3) * smoothstep(.975, 1., e) * (.6 + uHover*1.5);
    col *= .2 + .8*uFocus;
    gl_FragColor = vec4(col, 1.);
  }`;

const carousel = new THREE.Group();
scene.add(carousel);
const cards = WORKS.map(([, zh, en], i) => {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.font = '900 120px "PingFang SC","Microsoft YaHei",system-ui,sans-serif'; ctx.fillText(zh, 56, 140);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '500 38px system-ui,sans-serif'; ctx.fillText(`${String(i + 1).padStart(2, '0')} — ${en.toUpperCase()}`, 60, 214);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uIdx: { value: WORKS[i][4] }, uHover: { value: 0 }, uFocus: { value: 0 }, uTex: { value: tex } },
    vertexShader: cardVS, fragmentShader: cardFS, side: THREE.DoubleSide,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 4.8, 40, 40), mat);
  m.userData = { i, hover: 0 };
  carousel.add(m);
  return m;
});

// 地面光环与漂浮尘埃
const floorRing = new THREE.Mesh(new THREE.RingGeometry(R - 0.02, R + 0.02, 160), new THREE.MeshBasicMaterial({ color: 0x7cf7ff, side: THREE.DoubleSide, transparent: true, opacity: .6 }));
floorRing.rotation.x = -Math.PI / 2; floorRing.position.y = -3;
scene.add(floorRing);
const floorRing2 = floorRing.clone(); floorRing2.scale.setScalar(1.35); floorRing2.material = floorRing.material.clone(); floorRing2.material.color.set(0xff5fd2); floorRing2.material.opacity = .3;
scene.add(floorRing2);
const dGeo = new THREE.BufferGeometry();
const dPos = new Float32Array(2000 * 3);
for (let i = 0; i < 2000; i++) { const a = Math.random() * 6.283, r = 3 + Math.random() * 20; dPos.set([Math.cos(a) * r, (Math.random() - .5) * 16, Math.sin(a) * r], i * 3); }
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xaab4ff, transparent: true, opacity: .7 }));
scene.add(dust);

// 交互
let rot = 0, rotT = 0, dragging = false, startX = 0, lastX = 0, moved = 0, current = -1;
const snap = () => { rotT = Math.round(rotT); };
const wrap = o => ((o % N) + N * 1.5) % N - N / 2;   // 换算到 (-N/2, N/2] 的最短偏移
const goTo = i => { rotT += wrap(i - rotT); snap(); };
const mouse = new THREE.Vector2(9, 9), ray = new THREE.Raycaster();
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => { dragging = true; startX = lastX = e.clientX; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (!dragging) return;
  rotT -= (e.clientX - lastX) * 0.008; lastX = e.clientX; moved = Math.abs(e.clientX - startX);
});
canvas.addEventListener('pointerup', e => {
  dragging = false; snap();
  if (moved > 6) return;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(cards.filter(c => c.visible))[0];
  if (!hit) return;
  const i = hit.object.userData.i;
  if (i === current) goPage(WORKS[i][0], e.clientX, e.clientY);
  else goTo(i);
});
let wheelLock = 0;
addEventListener('wheel', e => { const now = performance.now(); if (now < wheelLock) return; wheelLock = now + 450; rotT += Math.sign(e.deltaY || e.deltaX); snap(); }, { passive: true });
document.getElementById('prev').onclick = () => { rotT -= 1; snap(); };
document.getElementById('next').onclick = () => { rotT += 1; snap(); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') { rotT += 1; snap(); } if (e.key === 'ArrowLeft') { rotT -= 1; snap(); } if (e.key === 'Enter') goPage(WORKS[current][0]); });

const tabsEl = document.getElementById('tabs'), ticksEl = document.getElementById('ticks');
tabsEl.innerHTML = CATS.map(([zh, at]) => `<button data-at="${at}">${zh}</button>`).join('');
tabsEl.querySelectorAll('button').forEach(b => b.onclick = () => goTo(+b.dataset.at));
ticksEl.innerHTML = WORKS.map((w, i) => `<i data-i="${i}" title="${w[1]}"></i>`).join('');
ticksEl.querySelectorAll('i').forEach(t => t.onclick = () => goTo(+t.dataset.i));
const info = document.getElementById('info');
function showInfo(i) {
  const [href, zh, en, desc] = WORKS[i];
  info.innerHTML = `<div class="num"><b>${String(i + 1).padStart(2, '0')}</b> / ${String(N).padStart(2, '0')} — ${en.toUpperCase()}</div>
    <div class="name">${[...zh].map((c, k) => `<span style="animation-delay:${k * 0.05}s">${c}</span>`).join('')}</div>
    <div class="desc">${desc}</div>
    <a class="enter" href="${href}" data-page>进入体验 →</a>`;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  rot += (rotT - rot) * (1 - Math.exp(-dt * 5));   // 按时间缓动，帧率高低不影响切换时长
  carousel.position.y = Math.sin(t * 0.8) * 0.12 + (camera.aspect < 1 ? 1.6 : 0);   // 竖屏时卡片上移，给下方文字留空间
  carousel.position.x = camera.aspect > 1 ? Math.min(3.2, (camera.aspect - 0.9) * 4) : 0;

  const idx = ((Math.round(rot) % N) + N) % N;
  if (idx !== current) {
    current = idx; showInfo(idx);
    tabsEl.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === Math.floor(idx / 6)));
    ticksEl.querySelectorAll('i').forEach((t, k) => t.classList.toggle('on', k === idx));
  }

  ray.setFromCamera(mouse, camera);
  const hovered = dragging ? null : ray.intersectObjects(cards.filter(c => c.visible))[0]?.object;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
  cards.forEach(c => {
    const o = wrap(c.userData.i - rot), ao = Math.abs(o);
    c.visible = ao < SHOW;
    if (!c.visible) return;
    const a = o * GAP;
    c.position.set(Math.sin(a) * R, 0, Math.cos(a) * R - ao * .7);
    c.rotation.y = a;
    const focus = Math.max(0, 1 - ao / 1.2);
    c.userData.hover += ((c === hovered ? 1 : 0) - c.userData.hover) * 0.1;
    const s = (1 - Math.min(ao, 3) * .07) * (1 + c.userData.hover * 0.05 + focus * 0.06);
    c.scale.set(s, s, s);
    c.material.uniforms.uFocus.value = Math.max(.12, Math.min(1, 1 - ao * .28)) * Math.min(1, (SHOW - ao) * 2);
    c.material.uniforms.uTime.value = t;
    c.material.uniforms.uHover.value = c.userData.hover;
  });

  floorRing.scale.setScalar(1 + Math.sin(t * 1.5) * 0.02);
  floorRing2.rotation.z = t * 0.1;
  dust.rotation.y = t * 0.03;
  const mx = mouse.x < 5 ? mouse.x : 0, my = mouse.y < 5 ? mouse.y : 0;
  camera.position.x += (mx * 1.2 - camera.position.x) * 0.04;
  camera.position.y += (0.8 + my * 0.6 - camera.position.y) * 0.04;
  camera.lookAt(0, 0, 0);
  composer.render();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fit(); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
